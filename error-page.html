/* ============================================================
   SolvAI Design System — index.css
   ============================================================ */
/* ── Google Fonts ── */
/* ── Design Tokens ── */
:root {
  /* Colors */
  --color-background:        #030303;
  --color-surface:           #09090b;

  --color-text-primary:      #e4e4e7;
  --color-text-secondary:    #71717a;

  --text-lg:   16px;
  --text-xl:   20px;
  --text-2xl:  24px;
  --text-3xl:  32px;
  --text-4xl:  40px;

  /* Spacing */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;

  --space-12: 48px;

  --sidebar-width:  240px;

}
/* ── Reset ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {

  font-family: var(--font-body);

}

/* ============================================================

/* Buttons */
.btn {

  gap: var(--space-2);

  white-space: nowrap;
  user-select: none;
}
.btn-primary {
  display: inline-flex;

  padding: 10px var(--space-5);

}
.btn-primary:hover {

.btn-secondary {

}
.btn-secondary:hover {

.btn-ghost {

}
.btn-danger {

  transition: all var(--transition-normal);

.btn-danger:hover {

/* Cards */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);

}
.card-elevated {

  padding: var(--space-6);

}
.card-glass {

  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.04);
}
/* Form Elements */
.form-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.label {
  font-size: var(--text-sm);

.input {

}
.input::placeholder { color: var(--color-text-disabled); }
.input:hover { border-color: rgba(255, 255, 255, 0.1); }
.input:focus {
  border-color: var(--color-border-focus);
  box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.08);
}
/* ============================================================
   STATUS BADGES
   ============================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.badge::before {
  content: '';
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.badge-connected,
.badge-completed {
  background: var(--color-status-success-bg);
  color: var(--color-status-success);
  border: 1px solid rgba(34, 197, 94, 0.2);
}
.badge-disconnected,
.badge-failed,
.badge-error {
  background: var(--color-status-error-bg);
  color: var(--color-status-error);
  border: 1px solid rgba(239, 68, 68, 0.2);
}
.badge-pending {
  background: var(--color-status-warning-bg);
  color: var(--color-status-warning);
  border: 1px solid rgba(245, 158, 11, 0.2);
  animation: badge-pulse 2s ease-in-out infinite;
}
.badge-generating {
  background: var(--color-accent-bg);
  color: var(--color-accent-primary);
  border: 1px solid rgba(0, 240, 255, 0.2);
  animation: badge-pulse-cyan 1.5s ease-in-out infinite;
}
/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes badge-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
@keyframes badge-pulse-cyan {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(0, 240, 255, 0.2); }
  50% { opacity: 0.75; box-shadow: 0 0 16px rgba(0, 240, 255, 0.4); }
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes pulse-cyan {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
  50% { box-shadow: 0 0 0 8px rgba(0, 240, 255, 0.1); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideInUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(-16px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes drawArc {
  from { stroke-dashoffset: var(--arc-length, 565); }

}
.animate-fadeIn { animation: fadeIn 0.3s ease forwards; }

.animate-slideRight { animation: slideInRight 0.3s ease forwards; }
/* ── Skeleton Loader ── */
.skeleton {

/* ── Page Layout Helpers ── */
.page-layout {
  display: flex;
  min-height: 100vh;

}
.page-content {

.text-accent { color: var(--color-accent-primary); }

    grid-template-columns: 1fr;

    padding: var(--space-5);
  }
